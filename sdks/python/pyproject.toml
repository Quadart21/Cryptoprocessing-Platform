[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noren-merchant"
version = "0.1.0"
description = "Merchant SDK for the Noren Digital payment API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Noren Digital" }]
keywords = ["noren", "payments", "crypto", "merchant", "invoices", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://noren.digital"
Documentation = "https://github.com/Quadart21/Cryptoprocessing-Platform/tree/main/sdks/python"
Source = "https://github.com/Quadart21/Cryptoprocessing-Platform/tree/main/sdks/python"

[tool.setuptools.packages.find]
where = ["src"]
