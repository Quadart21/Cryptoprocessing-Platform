# Подключать после `certbot certonly --webroot -w /var/www/html -d kupik.asia`.
# Не заменяет HTTP-блок: редирект с 80 включайте только когда сертификат уже на диске.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kupik.asia;

    ssl_certificate /etc/letsencrypt/live/kupik.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kupik.asia/privkey.pem;

    client_max_body_size 256k;

    location /webhooks/noren {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /webhook {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
