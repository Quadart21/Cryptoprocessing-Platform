# Приём вебхуков Noren на kupik.asia.
# Бот слушает 127.0.0.1:8787. Этот файл — только HTTP.
# HTTPS: examples/kupik.asia.ssl.nginx.conf после выпуска сертификата.
#
# DNS (ns1/ns2.mitelis.cc): A kupik.asia → публичный IP сервера.
# Не трогает WireGuard: отдельный server_name, reload nginx, без ufw и wg-quick.
#
# sudo cp examples/kupik.asia.nginx.conf /etc/nginx/sites-available/kupik.asia.conf
# sudo ln -s /etc/nginx/sites-available/kupik.asia.conf /etc/nginx/sites-enabled/kupik.asia.conf
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kupik.asia;

    client_max_body_size 256k;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /webhooks/noren {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /webhook {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
