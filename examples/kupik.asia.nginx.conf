# Приём вебхуков Noren на kupik.asia.
# Бот слушает 127.0.0.1:8787, nginx отдаёт наружу только HTTPS.
#
# DNS (NiceNIC, ns3/ns4.my-ndns.com): A-запись kupik.asia → публичный IP этого сервера.
# Сертификат:
#   certbot certonly --nginx -d kupik.asia
#
# sudo cp examples/kupik.asia.nginx.conf /etc/nginx/sites-available/kupik.asia.conf
# sudo ln -s /etc/nginx/sites-available/kupik.asia.conf /etc/nginx/sites-enabled/kupik.asia.conf
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kupik.asia;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://kupik.asia$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kupik.asia;

    ssl_certificate /etc/letsencrypt/live/kupik.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kupik.asia/privkey.pem;

    client_max_body_size 256k;

    location /webhooks/noren {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /webhook {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
